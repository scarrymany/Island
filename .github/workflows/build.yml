name: Windows build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'Release v') && github.sha || 'build' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        if: github.ref_type == 'tag'
        run: ./scripts/release.ps1 -Tag $env:GITHUB_REF_NAME -ValidateOnly

      - name: Install Qt 6.8.3
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { throw 'aqtinstall installation failed.' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt" --archives qtbase qttools qttranslations
          if ($LASTEXITCODE -ne 0) { throw 'Qt installation failed.' }

      - name: Install NSIS
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          Join-Path ${env:ProgramFiles(x86)} 'NSIS' | Add-Content -LiteralPath $env:GITHUB_PATH

      - name: Build, test and package
        run: ./scripts/build.ps1 -QtPath "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" -Configuration Release -Package

      - name: Verify settings with native Windows fonts and widgets
        run: |
          $env:PATH = "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin;$env:PATH"
          $env:QT_QPA_PLATFORM = 'windows'
          foreach ($suite in @('settings', 'settings_workflows')) {
            $output = Join-Path $env:RUNNER_TEMP "native-$suite.txt"
            $test = Join-Path $env:GITHUB_WORKSPACE "build/native/Release/test_$suite.exe"
            $process = Start-Process -FilePath $test -ArgumentList @('-o', ('"{0},txt"' -f $output)) -WindowStyle Hidden -PassThru
            if (!$process.WaitForExit(60000)) {
              $process.Kill()
              throw "Native $suite test timed out."
            }
            Get-Content -LiteralPath $output
            if ($process.ExitCode -ne 0) { throw "Native $suite test failed with exit code $($process.ExitCode)." }
          }

      - name: Verify generated per-user installer script
        run: |
          $scripts = @(Get-ChildItem -LiteralPath 'dist/_CPack_Packages' -Filter project.nsi -Recurse -File)
          if ($scripts.Count -ne 1) { throw 'Expected exactly one generated NSIS installer script.' }
          cmake "-DTEMPLATE_PATH=$($scripts[0].FullName)" -P cmake/VerifyNsisTemplate.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Generated NSIS installer scope verification failed.' }

      - name: Smoke test deployed application without the Qt SDK
        run: |
          $applicationDir = Join-Path $env:GITHUB_WORKSPACE 'dist/Island'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'island-deployment-smoke.json'
          $env:PATH = "$env:WINDIR/System32;$env:WINDIR;$env:WINDIR/System32/Wbem"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QT_QPA_PLATFORM_PLUGIN_PATH, Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $arguments = @('--demo', '--smoke-test', '--diagnostics', ('"{0}"' -f $diagnostics))
          $process = Start-Process -FilePath (Join-Path $applicationDir 'Island.exe') -WorkingDirectory $applicationDir -ArgumentList $arguments -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(20000)) {
            $process.Kill()
            throw 'Deployed Island did not finish its smoke test.'
          }
          if ($process.ExitCode -ne 0) { throw "Deployed Island exited with code $($process.ExitCode)." }
          if (!(Test-Path -LiteralPath $diagnostics)) { throw 'The deployed application did not produce diagnostics.' }
          Get-Content -LiteralPath $diagnostics -Raw | ConvertFrom-Json | Out-Null
          Write-Output 'Deployed application smoke test passed with only Windows system directories in PATH.'

      - name: Capture the real Windows application in isolated demo mode
        run: |
          $applicationDir = Join-Path $env:GITHUB_WORKSPACE 'dist/Island'
          $captures = Join-Path $env:GITHUB_WORKSPACE 'artifacts/screenshots'
          $arguments = @('--demo', '--smoke-test', '--capture', ('"{0}"' -f $captures))
          $process = Start-Process -FilePath (Join-Path $applicationDir 'Island.exe') -WorkingDirectory $applicationDir -ArgumentList $arguments -PassThru
          if (!$process.WaitForExit(25000)) { $process.Kill(); throw 'Demo capture timed out.' }
          if ($process.ExitCode -ne 0) { throw "Demo capture failed: $($process.ExitCode)." }
          Add-Type -AssemblyName System.Drawing
          foreach ($name in @('hud.png', 'settings.png', 'position.png', 'profiles.png', 'system.png', 'updates.png', 'whats-new.png')) {
            $path = Join-Path $captures $name
            $image = [System.Drawing.Image]::FromFile($path)
            try {
              if ($image.Width -lt 100 -or $image.Height -lt 50) { throw "Empty capture: $name" }
              Write-Output "$name : $($image.Width) x $($image.Height)"
            } finally { $image.Dispose() }
          }
          Get-Content (Join-Path $captures 'capture-info.txt')

      - name: Verify native desktop composition and hit testing
        run: |
          cmake -S . -B build/native "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" -DISLAND_DESKTOP_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Desktop test configuration failed.' }
          cmake --build build/native --config Release --target test_desktop --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Desktop test compilation failed.' }
          $env:PATH = "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin;$env:PATH"
          $env:QT_QPA_PLATFORM = 'windows'
          $env:ISLAND_DESKTOP_CAPTURE_DIR = Join-Path $env:GITHUB_WORKSPACE 'artifacts/desktop'
          $output = Join-Path $env:RUNNER_TEMP 'desktop-composition.txt'
          $process = Start-Process -FilePath 'build/native/Release/test_desktop.exe' -ArgumentList @('-o', ('"{0},txt"' -f $output)) -PassThru
          if (!$process.WaitForExit(90000)) { $process.Kill(); throw 'Desktop test timed out.' }
          Get-Content -LiteralPath $output
          if ($process.ExitCode -ne 0) { throw "Desktop composition verification failed: $($process.ExitCode). Inspect before release." }

      - name: Upload actual application screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Island-screenshots
          path: artifacts/screenshots
          if-no-files-found: error
          retention-days: 30

      # Text transport permits visual review through read-only Actions log clients
      # as well as the normal downloadable artifact. These contain demo data only.
      - name: Export review captures to the build log
        run: |
          foreach ($file in Get-ChildItem 'artifacts/screenshots/*.png') {
            Write-Output ("ISLAND_CAPTURE_BEGIN:" + $file.Name)
            $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($file.FullName))
            for ($offset = 0; $offset -lt $encoded.Length; $offset += 4096) {
              Write-Output ("ISLAND_CAPTURE_DATA:" + $encoded.Substring($offset, [Math]::Min(4096, $encoded.Length - $offset)))
            }
            Write-Output 'ISLAND_CAPTURE_END'
          }

      - name: Verify installation and uninstallation on the clean runner
        run: ./scripts/test-installer.ps1

      - name: Prepare release files
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./scripts/release.ps1 -Tag $tag

      - name: Upload Windows packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Island-win-x64
          path: |
            dist/Island-Setup.exe
            dist/Island-win-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && github.repository == 'scarrymany/Island' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')))
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Island-win-x64
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Island-screenshots
          path: artifacts/screenshots

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            $message = (git log -1 --format=%s).Trim()
            if ($message -notmatch '^Release (v[0-9]+\.[0-9]+\.[0-9]+)$') { throw 'Expected an exact Release vX.Y.Z commit subject.' }
            $tag = $Matches[1]
            ./scripts/release.ps1 -Tag $tag -ValidateOnly
            if ($LASTEXITCODE -ne 0) { throw 'Release version validation failed.' }
            # The build dependency above has passed every test before this point.
            # GitHub's temporary job token creates no persistent credentials.
            $ref = "refs/tags/$tag"
            $existing = git ls-remote origin $ref
            if ($LASTEXITCODE -ne 0) { throw 'Could not check the release tag.' }
            if ($existing) {
              git fetch origin "tag" $tag
              if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the existing release tag.' }
              $tagCommit = (git rev-parse "$tag^{commit}").Trim()
              if ($tagCommit -cne $env:GITHUB_SHA) { throw 'Existing release tag points to a different commit.' }
            } else {
              gh api "repos/$env:GITHUB_REPOSITORY/git/refs" -X POST -f ref=$ref -f sha=$env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed; no release was published.' }
              git tag $tag $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw 'Local tag creation failed.' }
            }
          }
          ./scripts/release.ps1 -Tag $tag -Publish
